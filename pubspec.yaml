name: axolink_supabase
description: "AxoLink - Insulin Cooler Monitor (Supabase)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  # Supabase Auth + Client
  supabase_flutter: ^2.8.0
  # Keep Firebase RTDB for IoT device data (hybrid approach)
  firebase_core: ^3.13.0
  firebase_database: ^11.3.10
  # Google Sign-In for native platforms
  google_sign_in: ^6.3.0
  # Local storage
  shared_preferences: ^2.5.0
  # Charts
  fl_chart: ^0.70.2
  # Notifications
  flutter_local_notifications: ^18.0.1
  # Fonts
  google_fonts: ^6.2.1
  # Background service
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  # App icon generator
  flutter_launcher_icons: ^0.14.4
  # Permissions
  permission_handler: ^11.3.1
  # Image picker
  image_picker: ^1.1.2
  # Secure storage for PIN
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
